<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos</title>

    <style>
        .searchbar {
            font-size: 20px;
            margin-left: 12px;
            margin-bottom: 30px;
            display: flex;
        }

        .videos {
            display: grid;
            grid-template-columns: repeat(3, 400px);
            gap: 30px;
        }

        .video {
            display: grid;
            grid-template-columns: 40px 1fr 40px;
            column-gap: 10px;
        }

        .preview {
            grid-column: 1 / 4;
        }

        .thumbnail {
            width: 400px;
            height: 250px;
            object-fit: cover;
            object-position: center;
            background-color: white;
        }

        .thumbnail:hover {
            transform: scale(1.1);
        }

        .chanel {
            grid-column: 1;
            padding-top: 10px;
        }

        .kanal {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .opisanie {
            grid-column: 2;
        }

        .opisanie p {
            margin: 8px 0;
        }

        .opis {
            color: grey;
        }

        .right-channel {
            grid-column: 3;
            padding-top: 10px;
        }
    </style>
</head>

<body>

    <div class="left-section" style="display: flex; justify-content: space-between;">
        <div style="width: 15px;">
            <img style="width: 40px;" src="jutub.png">
        </div>
    
        <div class="middle-section" style="flex: 1; max-width: 500px; margin-left: 70px; margin-right: 35px;">
            <input class="searchbar" type="text" placeholder="hladat">
        </div>
    
        <div class="right-section" style="width: 20px;">
            <img style="width: 40px;" src="profil.jpg">
        </div>
    </div>
