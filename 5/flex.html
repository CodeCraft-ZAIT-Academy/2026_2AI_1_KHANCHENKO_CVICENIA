<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
</head>
<body style="padding-bottom: 1000px;">
    <div style="display: flex; flex-direction: row;">
        <div style="background-color: blue;">div1</div>
        <div style="background-color: gold;">div2
        <p>kchau</p>
        </div>
    </div>

    <div style="display: flex; flex-direction: row; margin-top: 10px;">
        <div style="background-color: blue;width: 100px;">div1</div>
        <div style="background-color: gold; flex:1;">div2</div>
    </div>

    <div style="display: flex; flex-direction: row; margin-top: 10px; height: 70px; border-width: 1px; border-style: solid;border-color: grey; justify-content: space-between;">
        <div style="background-color: blue;width: 100px;">div1</div>
        <div style="background-color: gold; width: 100px;">div2</div>
    </div>

    <div style="display: flex; flex-direction: row; margin-top: 10px; height: 200px; border-width: 1px; border-style: solid;border-color: grey; justify-content: space-between;align-items: end;">
        <div style="background-color: blue;width: 100px;">div1</div>
        <div style="background-color: violet ;width:500px;">div3</div>
        <div style="background-color: gold; width: 100px;">div2</div>
    </div>
</body>
</html>
